<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Empresa Virtual PAMAVA · Ruta contable</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<div class="wm">PAMAVA soluciones</div>
<div id="app"></div>
<script src="core.js"></script>
<script>
/* ---- 4. SESIÓN ---- */
let ME=null;  // {rol:'est'|'doc', emp, data}

function viewLogin(){
 ME=null;sesionSet(null);
 $("#app").innerHTML=`<div class="login card">
 <div class="brand c">PAMAVA soluciones</div>
 <h1 class="c">Empresa Virtual</h1>
 <p class="c mu">Trabaja como auxiliar contable de una empresa real: 6 estaciones, de los asientos al programa contable.</p>
 <label class="sm mu">Tu código de ingreso</label>
 <input id="lc" placeholder="Ejemplo: EV-0000" autocapitalize="characters" autocomplete="off">
 <label class="sm mu">Tu nombre completo (solo la primera vez)</label>
 <input id="ln" placeholder="Nombre y apellido" autocomplete="off">
 <button id="go" style="width:100%">Entrar</button>
 <p class="sm mu c" style="margin-top:12px">Las empresas y cifras son ficticias y de uso educativo.<br>Almacenamiento: <b>${Store.mode==="firebase"?"en la nube":"solo en este equipo (modo prueba)"}</b></p>
 </div>`;
 $("#go").onclick=login;
 $("#lc").addEventListener("keydown",e=>{if(e.key==="Enter")login();});
 try{const s=localStorage.getItem("pamava_ev_last");if(s){const j=JSON.parse(s);$("#lc").value=j.c||"";$("#ln").value=j.n||"";}}catch(e){}
}
async function login(){
 const code=$("#lc").value.trim(),name=$("#ln").value.trim();
 if(!code){toast("Escribe tu código.");return;}
 const h=await sha(code);
 if(h===CFG.hashes.doc){ME={rol:"doc"};sesionSet({rol:"doc"});viewDocente();return;}
 const i=CFG.hashes.codes.indexOf(h);
 if(i<0){toast("Ese código no existe. Revísalo con tu profesor.");return;}
 const emp=EMPRESAS[i];
 const data=await cargar(emp.n);
 if(!data.alumno){
  if(!name){toast("Escribe tu nombre completo.");return;}
  data.alumno=name;await Store.set(emp.n,data);
 }
 try{localStorage.setItem("pamava_ev_last",JSON.stringify({c:code,n:data.alumno}));}catch(e){}
 ME={rol:"est",emp,data};sesionSet({rol:"est",n:emp.n});viewMapa();
}

/* ---- 5. VISTA DEL ESTUDIANTE ---- */
async function viewMapa(){
 const emp=ME.emp;ME.data=await cargar(emp.n);const d=ME.data;
 const pr=progreso(d);
 const cards=ESTACIONES.map(s=>{
  const e=d.estaciones[s.n];
  let cls="lock",chip=`<span class="pill l">🔒 Bloqueada</span>`,btn="";
  if(e.estado==="abierta"){cls="open";chip=`<span class="pill">▶ Disponible</span>`;btn=`<button data-go="${s.n}">Entrar</button>`;}
  if(e.estado==="aprobada"){cls="done";chip=`<span class="pill ok">✅ Aprobada · ${Number(e.nota).toFixed(1)}</span>`;btn=`<button class="sec" data-go="${s.n}">Repasar</button>`;}
  return`<div class="st ${cls}"><div class="ic">${s.ic}</div><div class="tx"><b>${s.n}. ${s.t}</b><span class="sm mu">${s.d}</span><div style="margin-top:4px">${chip}</div></div>${btn}</div>`;}).join("");
 $("#app").innerHTML=`
 <div class="top"><div><span class="brand">PAMAVA soluciones</span><div class="sm mu">${esc(d.alumno)}</div></div><button class="gr" id="out">${ME.via?"← Panel docente":"Salir"}</button></div>
 <div class="card"><span class="pill">Empresa ${emp.n}</span>
  <h2 style="margin-top:6px">${esc(emp.nombre)}</h2>
  <div class="mu">NIT ${nit(emp.n)} · ${esc(emp.sector)} · Ibagué, Tolima</div>
  <div class="note">Eres el auxiliar contable de esta empresa. Vas a trabajar <b>un mes completo</b> de operaciones, estación por estación. Para pasar a la siguiente debes aprobar la evaluación de la estación con <b>${CFG.notaMinima.toFixed(1)} o más</b> sobre 5.0.</div>
  <div class="sm mu">Tu avance: ${pr} de 6 estaciones</div><div class="bar"><i style="width:${pr/6*100}%"></i></div>
 </div>
 <h3>Tu ruta</h3><div class="map">${cards}</div>
 <div class="wmk">© ${CFG.marca} · Empresas y cifras ficticias</div>`;
 $("#out").onclick=ME.via?(()=>{sesionSet({rol:"doc"});ME={rol:"doc"};viewDocente();}):viewLogin;
 document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>abrirEstacion(+b.dataset.go));
}
function abrirEstacion(n){
 const s=ESTACIONES[n-1];
 if(n===1){location.href="est1.html";return;}
 if(n===2){location.href="est2.html";return;}
 const d=document.createElement("div");d.className="modal";
 d.innerHTML=`<div><h2>${s.ic} Estación ${n} · ${s.t}</h2><div class="note w">Esta estación se está construyendo y se abrirá en una próxima entrega. Por ahora, tu profesor puede probar el avance con las evaluaciones.</div><div class="c"><button id="x">Entendido</button></div></div>`;
 document.body.appendChild(d);d.querySelector("#x").onclick=()=>d.remove();
}

/* ---- 6. PANEL DEL DOCENTE ---- */
async function viewDocente(){
 const all=await Store.all();
 const rows=EMPRESAS.map(e=>{
  const d=all[e.n]||null;
  const celdas=ESTACIONES.map(s=>{
   if(!d)return`<td><span class="cell l">—</span></td>`;
   const x=d.estaciones[s.n];
   if(x.estado==="aprobada")return`<td><span class="cell ok" title="Aprobada">${Number(x.nota).toFixed(1)}</span></td>`;
   if(x.estado==="abierta")return`<td><span class="cell o" title="Disponible">▶</span></td>`;
   return`<td><span class="cell l" title="Bloqueada">🔒</span></td>`;}).join("");
  return`<tr><td><b>${e.n}</b></td><td>${esc(e.nombre)}<div class="sm mu">${esc(e.sector)}</div></td>
   <td><input data-name="${e.n}" value="${d?esc(d.alumno):""}" placeholder="Estudiante"></td>${celdas}
   <td class="sm">${d?fecha(d.actualizado):"—"}</td>
   <td style="white-space:nowrap"><button class="s" data-enter="${e.n}">Entrar</button> <button class="sec s" data-open="${e.n}">Detalle</button> <button class="dg s" data-reset="${e.n}">Reiniciar</button></td></tr>`;}).join("");
 $("#app").innerHTML=`
 <div class="top"><div><span class="brand">PAMAVA soluciones</span><div class="sm mu">🧑‍🏫 Panel del docente · almacenamiento: <b>${Store.mode==="firebase"?"nube (Firebase)":"solo este equipo (modo prueba)"}</b></div></div><button class="gr" id="out">Salir</button></div>
 <div class="card"><h3>Grupo de empresas</h3>
  <p class="sm mu">Las 20 empresas son fijas. Escribe el nombre del estudiante que tiene cada una. “Reiniciar” borra el avance y el trabajo de esa empresa, pero la empresa y su código se conservan para el próximo grupo.</p>
  <div class="toolbar"><button id="ref" class="sec">↻ Actualizar</button><button id="csv" class="sec">⬇ Exportar notas (Excel)</button><button id="rg" class="dg">Reiniciar TODO el grupo</button><button id="hs" class="gr">Cambiar una clave</button><button id="pn" class="gr">🔌 Probar la nube</button></div>
  <div class="sc"><table><thead><tr><th>#</th><th>Empresa</th><th>Estudiante</th>${ESTACIONES.map(s=>`<th title="${s.t}">${s.n}</th>`).join("")}<th>Último cambio</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="sm mu">Cuadro de estaciones: nota = aprobada · ▶ = disponible · 🔒 = bloqueada. Nota mínima para aprobar: ${CFG.notaMinima.toFixed(1)}.</p></div>
 <div class="wmk">© ${CFG.marca}</div>`;
 $("#out").onclick=viewLogin;$("#ref").onclick=viewDocente;
 $("#csv").onclick=()=>exportar(all);
 $("#rg").onclick=reiniciarTodo;$("#hs").onclick=herramientaHuella;$("#pn").onclick=async()=>{toast("Probando…");const r=await Store.probar();alert(r);};
 document.querySelectorAll("[data-name]").forEach(i=>i.onchange=async()=>{const n=+i.dataset.name;const d=await cargar(n);d.alumno=i.value.trim();await Store.set(n,d);toast("Nombre guardado");});
 document.querySelectorAll("[data-reset]").forEach(b=>b.onclick=async()=>{const n=+b.dataset.reset;if(!confirm("¿Reiniciar la empresa "+n+"? Se borra el avance y el trabajo de su estudiante."))return;await Store.del(n);toast("Empresa "+n+" reiniciada");viewDocente();});
 document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>detalle(+b.dataset.open));
 document.querySelectorAll("[data-enter]").forEach(b=>b.onclick=async()=>{const n=+b.dataset.enter;const emp=EMPRESAS[n-1];ME={rol:"est",emp,via:true};sesionSet({rol:"doc",n:n});viewMapa();});
}
async function detalle(n){
 const e=EMPRESAS[n-1];const d=await cargar(n);
 const m=document.createElement("div");m.className="modal";
 const lines=ESTACIONES.map(s=>{const x=d.estaciones[s.n];
  const chip=x.estado==="aprobada"?`<span class="pill ok">Aprobada ${Number(x.nota).toFixed(1)}</span>`:x.estado==="abierta"?`<span class="pill">Disponible</span>`:`<span class="pill l">Bloqueada</span>`;
  return`<tr><td>${s.ic} ${s.n}. ${s.t}<div class="sm mu">${x.intentos.length} intento(s)</div></td><td>${chip}</td>
  <td style="white-space:nowrap">${x.estado==="bloqueada"?`<button class="sec s" data-a="open" data-s="${s.n}">Abrir</button>`:""}${x.estado==="abierta"?`<button class="s" data-a="ok" data-s="${s.n}">Aprobar</button>`:""}${x.estado==="aprobada"?`<button class="dg s" data-a="re" data-s="${s.n}">Reiniciar</button>`:""}</td></tr>`;}).join("");
 m.innerHTML=`<div><h2>Empresa ${n}</h2><div class="mu">${esc(e.nombre)} · ${esc(d.alumno||"sin estudiante")}</div>
  <div class="sc"><table><tbody>${lines}</tbody></table></div>
  <p class="sm mu">“Aprobar” registra la estación como aprobada con la nota que escribas (para pruebas o casos especiales). “Abrir” desbloquea una estación saltándose el orden.</p>
  <div class="c"><button id="x" class="gr">Cerrar</button></div></div>`;
 document.body.appendChild(m);
 m.querySelector("#x").onclick=()=>{m.remove();viewDocente();};
 m.querySelectorAll("[data-a]").forEach(b=>b.onclick=async()=>{
  const s=+b.dataset.s,a=b.dataset.a;const dd=await cargar(n);
  if(a==="open"){dd.estaciones[s].estado="abierta";}
  if(a==="ok"){const v=prompt("Nota de la estación "+s+" (0 a 5):",String(CFG.notaMinima.toFixed(1)));if(v===null)return;const nota=parseFloat(String(v).replace(",","."));if(isNaN(nota)||nota<0||nota>5){toast("Nota no válida");return;}dd.estaciones[s].intentos.push({v:"A",nota,fecha:Date.now(),manual:true});if(nota>=CFG.notaMinima)aprobar(dd,s,nota);else toast("Nota por debajo de "+CFG.notaMinima.toFixed(1)+": no se aprueba.");}
  if(a==="re"){for(let k=s;k<=6;k++){dd.estaciones[k]={estado:k===s?"abierta":"bloqueada",nota:null,intentos:[]};}}
  await Store.set(n,dd);m.remove();detalle(n);
 });
}
async function reiniciarTodo(){
 const t=prompt("Esto borra el avance y el trabajo de TODAS las empresas (las empresas y sus códigos se conservan). Antes exporta las notas.\n\nPara confirmar escribe BORRAR:");
 if(t!=="BORRAR"){if(t!==null)toast("No se borró nada.");return;}
 for(const e of EMPRESAS)await Store.del(e.n);
 toast("Grupo reiniciado");viewDocente();
}
function exportar(all){
 const head=["Empresa","Nombre empresa","Estudiante",...ESTACIONES.map(s=>"Est."+s.n+" "+s.t)];
 const lines=[head];
 EMPRESAS.forEach(e=>{const d=all[e.n];lines.push([e.n,e.nombre,d?d.alumno:"",...ESTACIONES.map(s=>{if(!d)return"";const x=d.estaciones[s.n];return x.estado==="aprobada"?Number(x.nota).toFixed(1):(x.estado==="abierta"?"en curso":"bloqueada");})]);});
 const csv="﻿"+lines.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(";")).join("\r\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="notas_empresa_virtual.csv";a.click();
}
function herramientaHuella(){
 const m=document.createElement("div");m.className="modal";
 m.innerHTML=`<div><h2>Huella de una clave nueva</h2><p class="sm mu">Escribe la clave o el código nuevo y copia la huella que aparece. Esa huella reemplaza a la anterior dentro del archivo (en CFG.hashes).</p><input id="k" style="width:100%" placeholder="Clave o código nuevo"><pre id="r" style="white-space:pre-wrap;word-break:break-all;background:#f2f6fb;padding:10px;border-radius:8px;font-size:12px"></pre><div class="c"><button id="x" class="gr">Cerrar</button></div></div>`;
 document.body.appendChild(m);m.querySelector("#x").onclick=()=>m.remove();
 m.querySelector("#k").oninput=async e=>{m.querySelector("#r").textContent=e.target.value.trim()?await sha(e.target.value):"";};
}

/* ---- 7. INICIO ---- */
(async()=>{
 await Store.init();
 const ses=sesionGet();
 if(ses&&ses.rol==="doc"&&!ses.n){ME={rol:"doc"};viewDocente();return;}
 if(ses&&ses.n){const emp=EMPRESAS[ses.n-1];ME={rol:"est",emp,via:ses.rol==="doc"};viewMapa();return;}
 viewLogin();
})();

</script>
</body>
</html>
