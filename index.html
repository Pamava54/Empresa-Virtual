<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Empresa Virtual PAMAVA · Ruta contable</title>
<style>
:root{--p:#1d4ed8;--pl:#e8effd;--bg:#f2f6fb;--card:#fff;--tx:#1f2937;--mu:#6b7280;--ok:#15803d;--okb:#dcfce7;--bad:#b91c1c;--badb:#fee2e2;--warn:#92400e;--warnb:#fef3c7;--bd:#dfe6ef}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 Arial,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
.wm{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(13vw,110px);font-weight:800;color:rgba(29,78,216,.05);transform:rotate(-24deg);pointer-events:none;z-index:0;white-space:nowrap}
#app{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:12px}
h1,h2,h3{margin:0 0 8px;line-height:1.25}h1{font-size:26px}h2{font-size:20px}h3{font-size:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.mu{color:var(--mu)}.sm{font-size:13px}.c{text-align:center}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 16px;background:var(--p);color:#fff;font-weight:700}
button:hover{filter:brightness(1.08)}
button.sec{background:#fff;color:var(--p);border:1.5px solid var(--p)}
button.gr{background:#eef2f7;color:var(--tx);border:1px solid var(--bd);font-weight:600}
button.dg{background:#fff;color:var(--bad);border:1.5px solid #fca5a5}
button.s{padding:5px 10px;font-size:13px}
button:disabled{opacity:.5;cursor:not-allowed}
input,select{font:inherit;border:1.5px solid #c7d2e0;border-radius:9px;padding:8px 10px;background:#fff;max-width:100%}
input:focus,select:focus{outline:2px solid #93b4f5}
.brand{font-weight:800;color:var(--p);letter-spacing:.5px}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--pl);color:var(--p)}
.pill.ok{background:var(--okb);color:var(--ok)}.pill.w{background:var(--warnb);color:var(--warn)}.pill.l{background:#eceff3;color:#6b7280}
.login{max-width:440px;margin:6vh auto}.login input{width:100%;margin:6px 0 12px}
.note{background:var(--pl);border-left:4px solid var(--p);border-radius:8px;padding:10px 14px;margin:10px 0}
.note.w{background:var(--warnb);border-color:#d97706}.note.r{background:var(--badb);border-color:#dc2626}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
.bar{height:12px;background:#e3e9f2;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#1d4ed8)}
.map{display:grid;gap:12px;margin-top:10px}
.st{display:flex;gap:14px;align-items:center;border:2px solid var(--bd);border-radius:14px;padding:14px;background:#fff}
.st.open{border-color:var(--p);box-shadow:0 0 0 3px rgba(29,78,216,.12)}
.st.lock{opacity:.6;background:#f6f8fb}
.st.done{border-color:#86efac;background:#f4fdf6}
.st .ic{font-size:30px;width:52px;height:52px;border-radius:14px;background:var(--pl);display:flex;align-items:center;justify-content:center;flex:none}
.st .tx{flex:1;min-width:0}
.st b{display:block}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle;font-size:13.5px}
th{background:#eef3fa;font-size:12px;text-transform:uppercase;color:#475569;white-space:nowrap}
td input{width:100%;min-width:130px}
.cell{display:inline-block;min-width:34px;text-align:center;border-radius:8px;padding:2px 6px;font-weight:700;font-size:12px}
.cell.ok{background:var(--okb);color:var(--ok)}.cell.o{background:var(--pl);color:var(--p)}.cell.l{background:#eceff3;color:#9aa3af}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:10px;z-index:99;max-width:90vw}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto}
.modal>div{background:#fff;border-radius:14px;padding:18px;max-width:560px;width:100%}
.wmk{text-align:center;font-size:12px;color:var(--mu);margin:20px 0}
</style>
</head>
<body>
<div class="wm">PAMAVA soluciones</div>
<div id="app"></div>
<script>
/* =====================================================================
   EMPRESA VIRTUAL PAMAVA · núcleo de la ruta contable
   Empresas y cifras ficticias, con fines educativos.
   ===================================================================== */

/* ---- 1. CONFIGURACIÓN ---- */
const CFG={
 marca:"PAMAVA soluciones",
 notaMinima:3.5,                 // nota para aprobar una estación (sobre 5.0)
 salt:"PAMAVA-EV|",
 /* Pega aquí tu firebaseConfig cuando lo tengas. Mientras sea null, todo se guarda solo en este equipo. */
 firebaseConfig:null,
 /* Huellas (SHA-256) de los códigos y de la clave docente. Los códigos reales están en Codigos_empresa_virtual.txt */
 hashes:{"codes":["332c7ee4331cf3b378cb0d280628518179c53028a4d500e90cef1cde986a1fd6","1daa6882770808baebd17e4cd93ac613b68a83b0d9625a016a593754d0ae59fa","7b053cce9ce7360027ce3efe893ca3236e651c44f465b633191493c3e5acc9d2","2fe6ef26b972c4e4618e4d97b9b7ba68df689c5350cc053b0868f0617f44609c","f2e03d680d943df1efe2f7db7700e8af33413ebf20896d5ee8246f0a20217fb3","77f454771886fa18e3fbe608ab091fc667a766f81c6388cd62d442398270c195","33a4fe15aa9fd54517b47037ce6680246c00c61640e5bdd4c1902828a989f8f5","aa06cfd6cde4ad5eaae40298f11cbbd9ffd5d3ff44001b29097d6b4351e3caec","a37778d664b9597d6e66f52d2110d9d9b02f06676b93d2969433e0c3b3e4036d","466f461c0fb8d917ad9c14c48a9cc47ed4f033624a49ebaf4e816d9374ce35d8","59496c7e78d1da2012506c2ad8de0eb846f3dc110a1667e4c09e61ae1aa82390","23057f3fe4c73d6ec3dd391e2915009e2649993fa0964cd37c2a8f9547e3fd14","378470043726a481abeecdfd10ed8689ec319ceec7858cd36f42b0081602e01d","55522de45ddea6e37c3bca2d0ff5211051a683507dbdaecf9b2bc4724924f6af","1ac64c702d253a373b0f264cb397ae980804120532d353cbb147ddbb5e4d9891","0e43cb6f8fb4107b53e79afcd24cddc66b516147dac7352bc040f625fe87ca4c","600c8157e4c03fe207b9ca28c09bc504abc89189dc0e162484ccdbfb615a444f","76f69cb2186b961088761476890c5996c1a81ef5459a7848e36b50d3fde2ce90","2433a1e3e2574f1a88ad11db5de7d2b73e17788163ff322e29b07adfd4f20322","90ab92e0f7b668238992b4d061be3d5bff6eef0c973e3359c56edfab6014522a","40f88d6d6868cc64d5e9e3f856a9af446e21e7905e1965af278ca4bffeb5ac0a"],"doc":"19cd1b1a7ad741ce8f02ed1a8dc62a632c5ae8680f77508a05a5abdd195708fb"}
};

const ESTACIONES=[
 {n:1,ic:"🧾",t:"Asientos contables",d:"Contabiliza los hechos económicos del mes de tu empresa."},
 {n:2,ic:"📚",t:"Libros contables",d:"Pasa tus asientos al libro diario y al mayor, y saca el balance de prueba."},
 {n:3,ic:"🏦",t:"Conciliación bancaria",d:"Concilia el extracto del banco con tu libro de bancos."},
 {n:4,ic:"📦",t:"Inventarios y compras",d:"Lleva el kardex y controla las compras del mes."},
 {n:5,ic:"📊",t:"Estados financieros",d:"Arma los estados financieros con tu balance de prueba."},
 {n:6,ic:"💻",t:"Simulador contable PAMAVA",d:"Registra todo el mes en el programa contable."}
];

/* 20 empresas fijas para estudiantes (+ la 21, de práctica del docente) */
const EMPRESAS=[
 ["Papelería Aprende S.A.S.","Papelería y útiles escolares"],
 ["Ferretería El Tornillo Ltda.","Ferretería y materiales"],
 ["Minimercado La Esquina S.A.S.","Minimercado y víveres"],
 ["Droguería Vida Sana S.A.S.","Droguería y salud"],
 ["Panadería Pan Caliente","Panadería y pastelería"],
 ["Restaurante Sabor Tolimense S.A.S.","Restaurante de comida típica"],
 ["Moda Joven Boutique S.A.S.","Ropa y accesorios"],
 ["Taller Auto Servicio El Pistón","Taller mecánico y repuestos"],
 ["Consultorio Odontológico Sonrisa S.A.S.","Servicios odontológicos"],
 ["Distribuidora Lácteos del Tolima S.A.S.","Distribución de lácteos"],
 ["Agencia de Viajes Rutas del Tolima","Agencia de viajes y turismo"],
 ["Salón de Belleza Estilo Propio","Peluquería y estética"],
 ["Heladería Dolce Freddo S.A.S.","Heladería y cafetería"],
 ["Cel Express Tecnología S.A.S.","Celulares y accesorios"],
 ["Veterinaria Patitas S.A.S.","Veterinaria y alimentos para mascotas"],
 ["Gimnasio Fuerza Total S.A.S.","Gimnasio y entrenamiento"],
 ["Lavandería Brisa Limpia","Lavandería y tintorería"],
 ["Floristería Pétalos y Más","Floristería y detalles"],
 ["Óptica Visión Clara S.A.S.","Óptica y salud visual"],
 ["Librería El Quijote Ltda.","Librería y papelería"],
 ["Minimercado Pamava (práctica del docente)","Minimercado · empresa de práctica del docente"]
].map((e,i)=>({n:i+1,nombre:e[0],sector:e[1],doc:i===20}));

/* ---- 2. UTILIDADES ---- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
async function sha(s){const b=new TextEncoder().encode(CFG.salt+s.trim().toUpperCase());const h=await crypto.subtle.digest("SHA-256",b);return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,"0")).join("");}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2800);}
function nit(n){let h=2166136261;const s="nit"+n;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}h>>>=0;const x=String(900000000+(h%99999999));return x.slice(0,3)+"."+x.slice(3,6)+"."+x.slice(6,9)+"-"+(h%10);}
function fecha(ts){if(!ts)return"—";const d=new Date(ts);return d.toLocaleDateString("es-CO")+" "+d.toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"});}

/* ---- 3. ALMACENAMIENTO (Firebase si hay configuración; si no, este equipo) ---- */
const Store={
 mode:"local",db:null,
 async init(){
  if(!CFG.firebaseConfig)return;
  try{
   const load=src=>new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s);});
   await load("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js");
   await load("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js");
   firebase.initializeApp(CFG.firebaseConfig);this.db=firebase.firestore();this.mode="firebase";
  }catch(e){console.error(e);this.mode="local";toast("No se pudo conectar con Firebase; se guardará solo en este equipo.");}
 },
 key(n){return"pamava_ev_v1_"+n;},
 async get(n){
  if(this.mode==="firebase"){const d=await this.db.collection("ev_empresas").doc(String(n)).get();return d.exists?d.data():null;}
  try{const j=localStorage.getItem(this.key(n));return j?JSON.parse(j):null;}catch(e){return null;}
 },
 async set(n,data){
  data.actualizado=Date.now();
  if(this.mode==="firebase"){await this.db.collection("ev_empresas").doc(String(n)).set(data);return;}
  try{localStorage.setItem(this.key(n),JSON.stringify(data));}catch(e){}
 },
 async del(n){
  if(this.mode==="firebase"){await this.db.collection("ev_empresas").doc(String(n)).delete();return;}
  try{localStorage.removeItem(this.key(n));}catch(e){}
 },
 async all(){
  const out={};
  if(this.mode==="firebase"){const q=await this.db.collection("ev_empresas").get();q.forEach(d=>{out[d.id]=d.data();});return out;}
  for(const e of EMPRESAS){const d=await this.get(e.n);if(d)out[e.n]=d;}
  return out;
 }
};
function nuevoEstado(){
 const est={};ESTACIONES.forEach(s=>{est[s.n]={estado:s.n===1?"abierta":"bloqueada",nota:null,intentos:[]};});
 return{alumno:"",estaciones:est,trabajo:{},creado:Date.now()};
}
async function cargar(n){let d=await Store.get(n);if(!d){d=nuevoEstado();await Store.set(n,d);}return d;}
function progreso(d){return ESTACIONES.filter(s=>d.estaciones[s.n]&&d.estaciones[s.n].estado==="aprobada").length;}
function actual(d){const s=ESTACIONES.find(x=>d.estaciones[x.n].estado==="abierta");return s?s.n:(progreso(d)===6?7:0);}
function aprobar(d,n,nota){
 const e=d.estaciones[n];e.estado="aprobada";e.nota=nota;
 const sig=d.estaciones[n+1];if(sig&&sig.estado==="bloqueada")sig.estado="abierta";
}

/* ---- 4. SESIÓN ---- */
let ME=null;  // {rol:'est'|'doc', emp, data}

function viewLogin(){
 ME=null;
 $("#app").innerHTML=`<div class="login card">
 <div class="brand c">PAMAVA soluciones</div>
 <h1 class="c">Empresa Virtual</h1>
 <p class="c mu">Trabaja como auxiliar contable de una empresa real: 6 estaciones, de los asientos al programa contable.</p>
 <label class="sm mu">Tu código de ingreso</label>
 <input id="lc" placeholder="Ejemplo: EV-0000" autocapitalize="characters" autocomplete="off">
 <label class="sm mu">Tu nombre completo (solo la primera vez)</label>
 <input id="ln" placeholder="Nombre y apellido" autocomplete="off">
 <button id="go" style="width:100%">Entrar</button>
 <p class="sm mu c" style="margin-top:12px">Las empresas y cifras son ficticias y de uso educativo.<br>Almacenamiento: <b>${Store.mode==="firebase"?"en la nube":"solo en este equipo (modo prueba)"}</b></p>
 </div>`;
 $("#go").onclick=login;
 $("#lc").addEventListener("keydown",e=>{if(e.key==="Enter")login();});
 try{const s=localStorage.getItem("pamava_ev_last");if(s){const j=JSON.parse(s);$("#lc").value=j.c||"";$("#ln").value=j.n||"";}}catch(e){}
}
async function login(){
 const code=$("#lc").value.trim(),name=$("#ln").value.trim();
 if(!code){toast("Escribe tu código.");return;}
 const h=await sha(code);
 if(h===CFG.hashes.doc){ME={rol:"doc"};viewDocente();return;}
 const i=CFG.hashes.codes.indexOf(h);
 if(i<0){toast("Ese código no existe. Revísalo con tu profesor.");return;}
 const emp=EMPRESAS[i];
 const data=await cargar(emp.n);
 if(!data.alumno){
  if(!name){toast("Escribe tu nombre completo.");return;}
  data.alumno=name;await Store.set(emp.n,data);
 }
 try{localStorage.setItem("pamava_ev_last",JSON.stringify({c:code,n:data.alumno}));}catch(e){}
 ME={rol:"est",emp,data};viewMapa();
}

/* ---- 5. VISTA DEL ESTUDIANTE ---- */
async function viewMapa(){
 const emp=ME.emp;ME.data=await cargar(emp.n);const d=ME.data;
 const pr=progreso(d);
 const cards=ESTACIONES.map(s=>{
  const e=d.estaciones[s.n];
  let cls="lock",chip=`<span class="pill l">🔒 Bloqueada</span>`,btn="";
  if(e.estado==="abierta"){cls="open";chip=`<span class="pill">▶ Disponible</span>`;btn=`<button data-go="${s.n}">Entrar</button>`;}
  if(e.estado==="aprobada"){cls="done";chip=`<span class="pill ok">✅ Aprobada · ${Number(e.nota).toFixed(1)}</span>`;btn=`<button class="sec" data-go="${s.n}">Repasar</button>`;}
  return`<div class="st ${cls}"><div class="ic">${s.ic}</div><div class="tx"><b>${s.n}. ${s.t}</b><span class="sm mu">${s.d}</span><div style="margin-top:4px">${chip}</div></div>${btn}</div>`;}).join("");
 $("#app").innerHTML=`
 <div class="top"><div><span class="brand">PAMAVA soluciones</span><div class="sm mu">${esc(d.alumno)}</div></div><button class="gr" id="out">Salir</button></div>
 <div class="card"><span class="pill">Empresa ${emp.n}</span>
  <h2 style="margin-top:6px">${esc(emp.nombre)}</h2>
  <div class="mu">NIT ${nit(emp.n)} · ${esc(emp.sector)} · Ibagué, Tolima</div>
  <div class="note">Eres el auxiliar contable de esta empresa. Vas a trabajar <b>un mes completo</b> de operaciones, estación por estación. Para pasar a la siguiente debes aprobar la evaluación de la estación con <b>${CFG.notaMinima.toFixed(1)} o más</b> sobre 5.0.</div>
  <div class="sm mu">Tu avance: ${pr} de 6 estaciones</div><div class="bar"><i style="width:${pr/6*100}%"></i></div>
 </div>
 <h3>Tu ruta</h3><div class="map">${cards}</div>
 <div class="wmk">© ${CFG.marca} · Empresas y cifras ficticias</div>`;
 $("#out").onclick=viewLogin;
 document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>abrirEstacion(+b.dataset.go));
}
function abrirEstacion(n){
 const s=ESTACIONES[n-1];
 const d=document.createElement("div");d.className="modal";
 d.innerHTML=`<div><h2>${s.ic} Estación ${n} · ${s.t}</h2><div class="note w">Esta estación se está construyendo y se abrirá en una próxima entrega. Por ahora, tu profesor puede probar el avance con las evaluaciones.</div><div class="c"><button id="x">Entendido</button></div></div>`;
 document.body.appendChild(d);d.querySelector("#x").onclick=()=>d.remove();
}

/* ---- 6. PANEL DEL DOCENTE ---- */
async function viewDocente(){
 const all=await Store.all();
 const rows=EMPRESAS.map(e=>{
  const d=all[e.n]||null;
  const celdas=ESTACIONES.map(s=>{
   if(!d)return`<td><span class="cell l">—</span></td>`;
   const x=d.estaciones[s.n];
   if(x.estado==="aprobada")return`<td><span class="cell ok" title="Aprobada">${Number(x.nota).toFixed(1)}</span></td>`;
   if(x.estado==="abierta")return`<td><span class="cell o" title="Disponible">▶</span></td>`;
   return`<td><span class="cell l" title="Bloqueada">🔒</span></td>`;}).join("");
  return`<tr><td><b>${e.n}</b></td><td>${esc(e.nombre)}<div class="sm mu">${esc(e.sector)}</div></td>
   <td><input data-name="${e.n}" value="${d?esc(d.alumno):""}" placeholder="Estudiante"></td>${celdas}
   <td class="sm">${d?fecha(d.actualizado):"—"}</td>
   <td style="white-space:nowrap"><button class="sec s" data-open="${e.n}">Abrir</button> <button class="dg s" data-reset="${e.n}">Reiniciar</button></td></tr>`;}).join("");
 $("#app").innerHTML=`
 <div class="top"><div><span class="brand">PAMAVA soluciones</span><div class="sm mu">🧑‍🏫 Panel del docente · almacenamiento: <b>${Store.mode==="firebase"?"nube (Firebase)":"solo este equipo (modo prueba)"}</b></div></div><button class="gr" id="out">Salir</button></div>
 <div class="card"><h3>Grupo de empresas</h3>
  <p class="sm mu">Las 20 empresas son fijas. Escribe el nombre del estudiante que tiene cada una. “Reiniciar” borra el avance y el trabajo de esa empresa, pero la empresa y su código se conservan para el próximo grupo.</p>
  <div class="toolbar"><button id="ref" class="sec">↻ Actualizar</button><button id="csv" class="sec">⬇ Exportar notas (Excel)</button><button id="rg" class="dg">Reiniciar TODO el grupo</button><button id="hs" class="gr">Cambiar una clave</button></div>
  <div class="sc"><table><thead><tr><th>#</th><th>Empresa</th><th>Estudiante</th>${ESTACIONES.map(s=>`<th title="${s.t}">${s.n}</th>`).join("")}<th>Último cambio</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="sm mu">Cuadro de estaciones: nota = aprobada · ▶ = disponible · 🔒 = bloqueada. Nota mínima para aprobar: ${CFG.notaMinima.toFixed(1)}.</p></div>
 <div class="wmk">© ${CFG.marca}</div>`;
 $("#out").onclick=viewLogin;$("#ref").onclick=viewDocente;
 $("#csv").onclick=()=>exportar(all);
 $("#rg").onclick=reiniciarTodo;$("#hs").onclick=herramientaHuella;
 document.querySelectorAll("[data-name]").forEach(i=>i.onchange=async()=>{const n=+i.dataset.name;const d=await cargar(n);d.alumno=i.value.trim();await Store.set(n,d);toast("Nombre guardado");});
 document.querySelectorAll("[data-reset]").forEach(b=>b.onclick=async()=>{const n=+b.dataset.reset;if(!confirm("¿Reiniciar la empresa "+n+"? Se borra el avance y el trabajo de su estudiante."))return;await Store.del(n);toast("Empresa "+n+" reiniciada");viewDocente();});
 document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>detalle(+b.dataset.open));
}
async function detalle(n){
 const e=EMPRESAS[n-1];const d=await cargar(n);
 const m=document.createElement("div");m.className="modal";
 const lines=ESTACIONES.map(s=>{const x=d.estaciones[s.n];
  const chip=x.estado==="aprobada"?`<span class="pill ok">Aprobada ${Number(x.nota).toFixed(1)}</span>`:x.estado==="abierta"?`<span class="pill">Disponible</span>`:`<span class="pill l">Bloqueada</span>`;
  return`<tr><td>${s.ic} ${s.n}. ${s.t}<div class="sm mu">${x.intentos.length} intento(s)</div></td><td>${chip}</td>
  <td style="white-space:nowrap">${x.estado==="bloqueada"?`<button class="sec s" data-a="open" data-s="${s.n}">Abrir</button>`:""}${x.estado==="abierta"?`<button class="s" data-a="ok" data-s="${s.n}">Aprobar</button>`:""}${x.estado==="aprobada"?`<button class="dg s" data-a="re" data-s="${s.n}">Reiniciar</button>`:""}</td></tr>`;}).join("");
 m.innerHTML=`<div><h2>Empresa ${n}</h2><div class="mu">${esc(e.nombre)} · ${esc(d.alumno||"sin estudiante")}</div>
  <div class="sc"><table><tbody>${lines}</tbody></table></div>
  <p class="sm mu">“Aprobar” registra la estación como aprobada con la nota que escribas (para pruebas o casos especiales). “Abrir” desbloquea una estación saltándose el orden.</p>
  <div class="c"><button id="x" class="gr">Cerrar</button></div></div>`;
 document.body.appendChild(m);
 m.querySelector("#x").onclick=()=>{m.remove();viewDocente();};
 m.querySelectorAll("[data-a]").forEach(b=>b.onclick=async()=>{
  const s=+b.dataset.s,a=b.dataset.a;const dd=await cargar(n);
  if(a==="open"){dd.estaciones[s].estado="abierta";}
  if(a==="ok"){const v=prompt("Nota de la estación "+s+" (0 a 5):",String(CFG.notaMinima.toFixed(1)));if(v===null)return;const nota=parseFloat(String(v).replace(",","."));if(isNaN(nota)||nota<0||nota>5){toast("Nota no válida");return;}dd.estaciones[s].intentos.push({v:"A",nota,fecha:Date.now(),manual:true});if(nota>=CFG.notaMinima)aprobar(dd,s,nota);else toast("Nota por debajo de "+CFG.notaMinima.toFixed(1)+": no se aprueba.");}
  if(a==="re"){for(let k=s;k<=6;k++){dd.estaciones[k]={estado:k===s?"abierta":"bloqueada",nota:null,intentos:[]};}}
  await Store.set(n,dd);m.remove();detalle(n);
 });
}
async function reiniciarTodo(){
 const t=prompt("Esto borra el avance y el trabajo de TODAS las empresas (las empresas y sus códigos se conservan). Antes exporta las notas.\n\nPara confirmar escribe BORRAR:");
 if(t!=="BORRAR"){if(t!==null)toast("No se borró nada.");return;}
 for(const e of EMPRESAS)await Store.del(e.n);
 toast("Grupo reiniciado");viewDocente();
}
function exportar(all){
 const head=["Empresa","Nombre empresa","Estudiante",...ESTACIONES.map(s=>"Est."+s.n+" "+s.t)];
 const lines=[head];
 EMPRESAS.forEach(e=>{const d=all[e.n];lines.push([e.n,e.nombre,d?d.alumno:"",...ESTACIONES.map(s=>{if(!d)return"";const x=d.estaciones[s.n];return x.estado==="aprobada"?Number(x.nota).toFixed(1):(x.estado==="abierta"?"en curso":"bloqueada");})]);});
 const csv="﻿"+lines.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(";")).join("\r\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="notas_empresa_virtual.csv";a.click();
}
function herramientaHuella(){
 const m=document.createElement("div");m.className="modal";
 m.innerHTML=`<div><h2>Huella de una clave nueva</h2><p class="sm mu">Escribe la clave o el código nuevo y copia la huella que aparece. Esa huella reemplaza a la anterior dentro del archivo (en CFG.hashes).</p><input id="k" style="width:100%" placeholder="Clave o código nuevo"><pre id="r" style="white-space:pre-wrap;word-break:break-all;background:#f2f6fb;padding:10px;border-radius:8px;font-size:12px"></pre><div class="c"><button id="x" class="gr">Cerrar</button></div></div>`;
 document.body.appendChild(m);m.querySelector("#x").onclick=()=>m.remove();
 m.querySelector("#k").oninput=async e=>{m.querySelector("#r").textContent=e.target.value.trim()?await sha(e.target.value):"";};
}
